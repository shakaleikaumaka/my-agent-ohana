<style>
:root{
  --shaka:#ffb443; --oso:#ff7eb6; --deva:#c792ea; --crops:#2f9e6f; --kala:#f7d794; --oke:#4fc3f7;
  --ink:#f5ead8; --dim:#c8bda8; --wood1:#8a5f3c; --wood2:#6b4a2f; --wood3:#4c3524; --carve:#3a2818;
  --card:rgba(24,14,8,.72); --line:rgba(255,200,130,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 50% 108%, rgba(255,122,40,.20), transparent 60%),
    radial-gradient(1400px 900px at 50% -20%, #131c3f 0%, #0a0f26 45%, #06081a 100%);
}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 40px}
nav{display:flex;align-items:center;gap:12px;padding:16px 2px}
nav img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 12px rgba(255,180,67,.5)}
.brand{font-size:12.5px;letter-spacing:.16em;color:var(--dim);font-weight:700}
.sp{flex:1}
.pill{border:1px solid var(--line);background:rgba(20,12,8,.6);border-radius:999px;padding:5px 7px;display:flex;gap:4px}
.pill button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;padding:4px 11px;border-radius:999px;cursor:pointer}
.pill button.on{background:var(--shaka);color:#241203;font-weight:700}

.stage{display:grid;grid-template-columns:minmax(300px,460px) minmax(320px,1fr);gap:26px;align-items:start;margin-top:6px}
@media (max-width:900px){.stage{grid-template-columns:1fr}}

/* ---------- THE POLE ---------- */
.polebox{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.pole{transform-origin:50% 100%;animation:sway 7.5s ease-in-out infinite;filter:drop-shadow(0 22px 34px rgba(0,0,0,.55))}
@keyframes sway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@media (prefers-reduced-motion:reduce){.pole{animation:none}}
.crown{width:72%;max-width:300px;text-align:center;margin-bottom:-6px;z-index:2}
.crown svg{width:100%;display:block}
.seg{width:86%;max-width:350px;margin-top:-5px;cursor:pointer;transition:transform .22s ease,filter .22s ease;position:relative;z-index:1}
.seg svg{width:100%;display:block}
.seg:hover{transform:translateY(-3px) scale(1.015)}
.seg.lit{animation:lean .5s ease}
@keyframes lean{35%{transform:translateY(-6px) scale(1.03)}}
.seg .glow{opacity:0;transition:opacity .25s ease}
.seg.lit .glow,.seg.talking .glow{opacity:1}
.seg.talking .mouthglow{animation:talkflick .18s infinite alternate}
@keyframes talkflick{from{opacity:.55}to{opacity:1}}
.base{width:96%;max-width:390px;margin-top:-4px}
.base svg{width:100%;display:block}
.pole.thinking .seg .eyes{animation:thinkpulse 1.1s ease-in-out infinite}
@keyframes thinkpulse{0%,100%{opacity:.25}50%{opacity:.95}}
.sweep{position:absolute;inset:-10% 0;pointer-events:none;overflow:hidden;border-radius:40px}
.sweep i{position:absolute;left:10%;right:10%;height:120px;top:-140px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,190,110,.18),transparent 70%);
  animation:sweepdown 9s linear infinite}
@keyframes sweepdown{to{transform:translateY(140vh)}}
.caption{margin-top:14px;text-align:center;color:var(--dim);font-size:13px;max-width:330px}
.caption b{color:var(--ink)}

/* ---------- THE LOG / CHAT ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;min-height:520px;max-height:min(74vh,760px);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-head .t{font-size:16.5px;font-weight:800}
.p-head .s{font-size:12px;color:var(--dim);margin-top:1px}
.lane{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.lane.live{color:#7ef0b2;border-color:rgba(126,240,178,.4)}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
.m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.m.v{align-self:flex-end;background:linear-gradient(135deg,rgba(255,180,67,.92),rgba(255,143,94,.92));color:#241203;border-bottom-right-radius:4px;font-weight:600}
.m.a{align-self:flex-start;background:rgba(255,235,200,.06);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .who{font-size:11.5px;font-weight:800;letter-spacing:.06em;margin-bottom:3px}
.m .badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;border-radius:999px;padding:1.5px 7px;margin-left:7px;vertical-align:1px;border:1px solid var(--line);color:var(--dim)}
.m .badge.live{color:#7ef0b2;border-color:rgba(126,240,178,.45)}
.p-send{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--line)}
.p-send input{flex:1;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:14.5px;outline:none}
.p-send input:focus{border-color:rgba(255,180,67,.5)}
.p-send button{border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--shaka);color:#241203}
.p-send button:disabled{opacity:.5;cursor:default}
.ceremony{margin:0 14px 14px;border:1px solid rgba(255,180,67,.4);background:linear-gradient(160deg,rgba(255,180,67,.14),rgba(255,143,94,.08));color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.ceremony:hover{background:linear-gradient(160deg,rgba(255,180,67,.22),rgba(255,143,94,.12))}
.ceremony:disabled{opacity:.55;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;padding:0 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,235,200,.18)}
.dots i.done{background:var(--shaka)}
.hint{padding:0 16px 12px;color:var(--dim);font-size:12.5px}
.hint b{color:var(--ink)}
footer{margin-top:26px;text-align:center;color:var(--dim);font-size:12.5px;line-height:2}
footer a{color:var(--oke);text-decoration:none}
footer .honest{border-top:1px solid var(--line);padding-top:14px;max-width:760px;margin:18px auto 0}
</style>
</head>

/* =============== EMBERS / SKY =============== */
(function(){
 var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,P=[],S=[];
 var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function size(){var d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;
   P=[];S=[];var n=Math.min(70,innerWidth/14);
   for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:H+Math.random()*H*.4,r:(.8+Math.random()*2.1)*d,v:(0.25+Math.random()*.7)*d,ph:Math.random()*6.28,hue:18+Math.random()*30});
   for(var j=0;j<90;j++)S.push({x:Math.random()*W,y:Math.random()*H*.62,r:(Math.random()<.85?.7:1.4)*d,tw:Math.random()*6.28});}
 function tick(){
   cx.clearRect(0,0,W,H);var t=Date.now()/1000,i,s,p;
   for(i=0;i<S.length;i++){s=S[i];cx.globalAlpha=.35+.3*Math.sin(t*1.4+s.tw);cx.fillStyle='#cdd8ff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();}
   for(i=0;i<P.length;i++){p=P[i];if(!reduced){p.y-=p.v;p.x+=Math.sin(t+p.ph)*.3;}if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
     cx.globalAlpha=.5+.4*Math.sin(t*3+p.ph);cx.fillStyle='hsl('+p.hue+',95%,62%)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}
   cx.globalAlpha=1;requestAnimationFrame(tick);}
 size();addEventListener('resize',size);tick();
})();

/* =============== LOG =============== */
var logEl=document.getElementById('log');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function add(who,color,text,badge,visitor){
 var d=document.createElement('div');d.className='m '+(visitor?'v':'a');
 d.innerHTML=(visitor?'':'<div class="who" style="color:'+color+'">'+who+(badge||'')+'</div>')+esc(text);
 logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;return d;}
function typeOut(who,color,text,badge,rate){
 var d=add(who,color,'',badge);var i=0;
 return new Promise(function(res){(function step(){d.childNodes[d.childNodes.length-1].textContent=text.slice(0,++i);logEl.scrollTop=logEl.scrollHeight;
   if(i<text.length)setTimeout(step,rate||14);else res();})();});}

/* =============== AUDIO =============== */
var curAudio=null;
function playVoice(f,src){
 if(curAudio){try{curAudio.pause();}catch(_){}}
 FACES.forEach(function(x){document.getElementById('seg-'+x.k).classList.remove('talking');});
 var seg=document.getElementById('seg-'+f.k);seg.classList.add('talking');
 var a=new Audio(src);curAudio=a;
 a.addEventListener('ended',function(){seg.classList.remove('talking');});
 a.addEventListener('error',function(){seg.classList.remove('talking');});
 a.play().catch(function(){seg.classList.remove('talking');});
 return a;
}
/* resolves when the clip finishes (or errors), at latest after maxMs; polls the ceremony abort flag */
function audioDone(a,maxMs){return new Promise(function(res){var done=false;function fin(){if(!done){done=true;res();}}
 if(!a){fin();return;}
 a.addEventListener('ended',fin);a.addEventListener('error',fin);
 var t0=Date.now();(function poll(){if(done)return;if(abort){try{a.pause();}catch(_){ }fin();return;}
   if(Date.now()-t0>maxMs){fin();return;}setTimeout(poll,200);})();});}
function stopVoice(){if(curAudio){try{curAudio.pause();}catch(_){}}FACES.forEach(function(x){document.getElementById('seg-'+x.k).classList.remove('talking');});}

/* =============== TAP A FACE =============== */
function tapFace(f){
 window.activeFace=f.k;
 var seg=document.getElementById('seg-'+f.k);
 seg.classList.remove('lit');void seg.offsetWidth;seg.classList.add('lit');
 playVoice(f,f.voice);
 var L=CJK.test((document.getElementById('inp').value||'')+window.LANG)?TEMPLE_LINES_ZH:TEMPLE_LINES;
 if(window.LANG==='zh')L=TEMPLE_LINES_ZH;
 add(f.n+' '+f.e,f.c,L[f.k]);
}

/* =============== THE CEREMONY =============== */
var ceremonyBtn=document.getElementById('ceremony'),dots=document.getElementById('dots'),running=false,abort=false;
ceremonyBtn.addEventListener('click',function(){
 if(running){abort=true;return;}
 running=true;abort=false;dots.hidden=false;
 ceremonyBtn.innerHTML='⏹ <span>'+(window.LANG==='zh'?'停止仪式':'stop the ceremony')+'</span>';
 var di=dots.querySelectorAll('i');di.forEach(function(x){x.className='';});
 (async function(){
   for(var i=0;i<BEATS.length;i++){
     if(abort)break;
     var b=BEATS[i],f=FACES.filter(function(x){return x.k===b.face;})[0];
     add((window.LANG==='zh'?'访客':'visitor')+' 🧑','',b.visitor,null,true);
     await new Promise(r=>setTimeout(r,650));if(abort)break;
     var seg=document.getElementById('seg-'+f.k);seg.classList.remove('lit');void seg.offsetWidth;seg.classList.add('lit');
     var au=playVoice(f,'totem/audio/demo/beat'+b.id+'.mp3');
     var durMs=(b.dur||8)*1000;
     var rate=Math.min(70,Math.max(16,Math.floor(durMs/Math.max(1,b.reply.length))));
     var typing=typeOut(f.n+' '+f.e,f.c,b.reply,null,rate);
     await Promise.all([typing,audioDone(au,durMs+5000)]);if(abort)break;
     di[i].className='done';
     await new Promise(r=>setTimeout(r,450));if(abort)break;
   }
   stopVoice();running=false;ceremonyBtn.disabled=false;
   ceremonyBtn.innerHTML='⚡ <span>'+(window.LANG==='zh'?'再播一次仪式':'play the ceremony again')+'</span>';
 })();
});

/* =============== LIVE LANE (OHANA DESK on Taurus, wake-law plumbing) =============== */
var HUB_DIRECT='https://ohana-chat.shakaverse.workers.dev';
var HUB=(location.protocol==='https:'&&/^(www\.)?myagentohana\.com$/i.test(location.hostname))?location.origin+'/api/chat':HUB_DIRECT;
var hubFellBack=false;
function hubFallback(){if(hubFellBack||HUB===HUB_DIRECT)return false;hubFellBack=true;HUB=HUB_DIRECT;return true;}
var sess=null;try{sess=localStorage.getItem('totem_sess');}catch(_){}
if(!sess){sess='totem-'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('totem_sess',sess);}catch(_){}}
var after=0,seen={},liveOK=false,lastHeard=Date.now(),ctl=null;
function j(url,opt){var c=new AbortController();ctl=c;var t=setTimeout(function(){c.abort();},32000);
 return fetch(url,Object.assign({signal:c.signal,cache:'no-store'},opt)).then(function(r){return r.json().catch(function(){return{};});}).finally(function(){clearTimeout(t);});}
function pump(initial){
 var url=HUB+'/poll?session='+encodeURIComponent(sess)+'&after='+(initial?0:after)+(initial?'':'&wait=25');
 return j(url).then(function(d){
   lastHeard=Date.now();
   var items=(d&&d.messages)||[];
   items.forEach(function(m){
     if(m.role==='visitor')return;
     if(seen[m.seq])return;seen[m.seq]=1;
     if(m.seq>after)after=m.seq;
     liveOK=true;laneState(true);
     add('ʻOHANA 🫶','#7ef0b2',m.text,'<span class="badge live">⚡ LIVE · TAURUS</span>');
   });
   setTimeout(function(){pump(false);},400);
 }).catch(function(e){
   if(e&&e.name==='AbortError'){setTimeout(function(){pump(false);},400);return;}
   if(hubFallback())setTimeout(function(){pump(false);},800);
   else setTimeout(function(){pump(false);},4000);
 });}
function laneState(on){var l=document.getElementById('lane');l.classList.toggle('live',on);
 document.getElementById('laneTxt').textContent=on?'LIVE · Taurus':(window.LANG==='zh'?'心灵通道':'spirit lane');}
pump(true);
setInterval(function(){if(Date.now()-lastHeard>45000){lastHeard=Date.now();pump(false);}},15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){lastHeard=Date.now();pump(false);}});
addEventListener('focus',function(){lastHeard=Date.now();pump(false);});
addEventListener('online',function(){lastHeard=Date.now();pump(false);});

/* =============== SEND =============== */
var inp=document.getElementById('inp'),sendBtn=document.getElementById('send'),busy=false;
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
/* summon routing: latin aliases match on WORD BOUNDARIES ("deva" no longer fires inside "devcon"),
   CJK aliases keep substring matching. Questions go LIVE to the desk — the spirit book is for
   summons and teach-asks (uke/karaoke), not for answering schedule questions. (scar 23 Oct:
   "when does Manu play at devcon?" got a canned DEVA greeting instead of the real answer.) */
function routeFace(t,forHint){
 var raw=t;t=t.toLowerCase();
 var question=/\?|？/.test(raw)||/^(when|what|who|where|how|why|which|whose|is |are |does |do |can |could |什么|谁|哪|怎么|几|多)/i.test(t);
 var teach=/uke|chord|karaoke|sing|song|和弦|尤克里里|卡拉|唱|琴/.test(t);
 for(var i=0;i<FACES.length;i++){var a=FACES[i].alias;
  for(var k=0;k<a.length;k++){var al=a[k];if(!al)continue;
   var hit=/[\u4e00-\u9fff]/.test(al)?t.indexOf(al.toLowerCase())>=0:new RegExp('\\b'+escRe(al.toLowerCase())+'\\b').test(t);
   if(hit){if(question&&!teach&&!forHint)return null;return FACES[i];}}}
 return null;}
function send(){
 var t=(inp.value||'').trim();if(!t||busy)return;
 inp.value='';add('you','',t,null,true);
 var f=routeFace(t);
 if(f){ // a named soul answers from the spirit book + its voice
   var L=CJK.test(t)?TEMPLE_LINES_ZH:TEMPLE_LINES;
   var seg=document.getElementById('seg-'+f.k);seg.classList.remove('lit');void seg.offsetWidth;seg.classList.add('lit');
   playVoice(f,f.voice);
   typeOut(f.n+' '+f.e,f.c,L[f.k],'<span class="badge">🌙 '+(window.LANG==='zh'?'精灵回声':'spirit echo')+'</span>');
   return;
 }
 // otherwise the FAMILY answers — live from Taurus
 // carry the summoned face as a hint: the desk answers AS that face from its real persona+pack
 var hint=routeFace(t,true)||window.activeFace;
 var wire=hint?'🗿[face:'+hint+'] '+t:t;
 busy=true;sendBtn.disabled=true;
 document.getElementById('pole').classList.add('thinking');
 fetch(HUB+'/send',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({session:sess,text:wire,name:'totem-visitor'})})
 .then(function(r){
   if(!r.ok)throw 0;
   setTimeout(function(){busy=false;sendBtn.disabled=false;document.getElementById('pole').classList.remove('thinking');},9000);
 })
 .catch(function(){
   document.getElementById('pole').classList.remove('thinking');busy=false;sendBtn.disabled=false;
   var f0=FACES[Math.floor(Math.random()*FACES.length)];
   var L=CJK.test(t)?TEMPLE_LINES_ZH:TEMPLE_LINES;
   typeOut(f0.n+' '+f0.e,f0.c,L[f0.k],'<span class="badge">🌙 '+(window.LANG==='zh'?'精灵回声':'spirit echo')+'</span>');
 });
 // safety: never leave the think-lights on
 setTimeout(function(){document.getElementById('pole').classList.remove('thinking');busy=false;sendBtn.disabled=false;},34000);
}
sendBtn.addEventListener('click',send);
inp.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
